schema_version = "1.0.0"
id = "ninesync_fx"
version = "0.3.0"
name = "NineSync: FX Importer"
tagline = "Import MMD accessories and MME effects"
maintainer = "sentrie"
website = "https://github.com/sen-trie/nine-sync-fx"
type = "add-on"
tags = ["Import-Export", "Animation", "Render"]
blender_version_min = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read .x, .fx and textures; write node library and cache"

[build]
paths_exclude_pattern = ["__pycache__/", "/tests/", "/tools/", "/docs/", "/debug-src/", "/.github/", "/.git/", ".gitignore", "/CLAUDE.md", "*.pyc"]
