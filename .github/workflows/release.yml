name: Release

# Runs when a push to master changes blender_manifest.toml. If the version number
# changed (any part, so 0.3.1 counts), it tags v<version> and publishes a release
# with the extension zip.
on:
  push:
    branches: [master]
    paths: [blender_manifest.toml]
  # Run by hand from the Actions tab: releases the current version if it has no tag yet.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the version change?
        id: version
        run: |
          read_version() { grep -m1 '^version' | cut -d'"' -f2; }
          new=$(read_version < blender_manifest.toml)
          old=""
          if [ "${{ github.event_name }}" = "push" ]; then
            old=$(git show "${{ github.event.before }}:blender_manifest.toml" 2>/dev/null | read_version || true)
          fi
          echo "old=${old:-none} new=$new"
          if [ "$new" != "$old" ]; then
            if git rev-parse -q --verify "refs/tags/v$new" > /dev/null; then
              echo "tag v$new already exists; nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "version=$new" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version unchanged; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Used only to run `extension build`; the add-on itself targets 5.3+.
      - name: Download Blender
        if: steps.version.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libgl1 libegl1 libsm6
          curl -sSL https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz | tar -xJ
          echo "BLENDER=$PWD/blender-5.2.3-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Validate and build
        if: steps.version.outputs.release == 'true'
        run: |
          "$BLENDER" --background --factory-startup --command extension validate .
          mkdir out
          "$BLENDER" --background --factory-startup --command extension build --source-dir . --output-dir out
          ls -l out

      - name: Release notes from the changelog
        if: steps.version.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " { if (on) exit; on = ($2 == v); next }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for ${{ steps.version.outputs.version }}"
            exit 1
          fi
          cat notes.md

      - name: Tag and publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" out/*.zip \
            --target "$GITHUB_SHA" \
            --title "NineSync: FX Importer v${{ steps.version.outputs.version }}" \
            --notes-file notes.md
