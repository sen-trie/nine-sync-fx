schema_version = "1.0.0"
id = "ninesync_fx"
version = "0.2.0"
name = "NineSync: FX Importer"
tagline = "Import MikuMikuDance accessories (.x) and run their MME effects (.fx) in Blender"
maintainer = "NineSync maintainers <noreply@example.invalid>"
type = "add-on"
tags = ["Import-Export", "Animation", "Render"]
blender_version_min = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read .x, .fx and texture files; write the shared node library and the pre-cull cache in the temp folder"

[build]
paths_exclude_pattern = ["__pycache__/", "/tests/", "/tools/", "*.pyc"]
